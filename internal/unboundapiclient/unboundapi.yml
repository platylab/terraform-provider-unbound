openapi: 3.0.0
info:
  title: Unbound API
  version: 1.0.0
  description: API for managing Unbound configurations through CRUD operations.
servers:
  - url: "{host}"
    description: The production API server
    variables:
      host:
        default: http://127.0.0.1:8080

paths:
  /login:
    post:
      summary: Authenticate and retrieve access token
      description: Authenticates user with username and password and returns a JWT access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        200:
          description: Successful login, returns access token
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
        400:
          description: Missing username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        401:
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /whoami:
    get:
      summary: Get current user and token expiry
      description: Returns the authenticated user's username and remaining token validity in seconds.
      security:
        - bearerAuth: []
      responses:
        200:
          description: Successful response with user info
          content:
            application/json:
              schema:
                type: object
                properties:
                  username:
                    type: string
                  token_expires_in:
                    type: integer
                    description: Remaining time in seconds until token expiration
        401:
          description: Unauthorized - Invalid or missing token

  /config/{clause}/{attribute}/{value_id}:
    get:
      summary: Retrieve configuration data
      description: Reads configuration values based on the provided clause, attribute, and ID.
      security:
        - bearerAuth: []
      parameters:
        - name: clause
          in: path
          required: true
          description: The clause in the configuration file (e.g., server).
          schema:
            type: string
        - name: attribute
          in: path
          required: true
          description: The attribute within the clause to read.
          schema:
            type: string
        - name: value_id
          in: path
          required: true
          description: The ID of the value to retrieve. Use `*` for all values.
          schema:
            type: string
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                  status:
                    type: integer
                    example: 200
        404:
          description: Not Found - Unsupported clause, attribute, or ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create a new configuration value
      description: Creates a new value for the specified clause and attribute.
      security:
        - bearerAuth: []
      parameters:
        - name: clause
          in: path
          required: true
          description: The clause in the configuration file (e.g., server).
          schema:
            type: string
        - name: attribute
          in: path
          required: true
          description: The attribute within the clause to modify.
          schema:
            type: string
        - name: value_id
          in: path
          required: true
          description: The ID for the new value. Use `*` for no specific ID.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
                - value
      responses:
        201:
          description: Value successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                  status:
                    type: integer
                    example: 201
        400:
          description: Bad Request - Missing or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        409:
          description: Conflict - Duplicate ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update an existing configuration value
      description: Updates an existing value for the specified clause, attribute, and ID.
      security:
        - bearerAuth: []
      parameters:
        - name: clause
          in: path
          required: true
          description: The clause in the configuration file (e.g., server).
          schema:
            type: string
        - name: attribute
          in: path
          required: true
          description: The attribute within the clause to update.
          schema:
            type: string
        - name: value_id
          in: path
          required: true
          description: The ID of the value to update.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: string
              required:
                - value
      responses:
        200:
          description: Value successfully updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                  status:
                    type: integer
                    example: 200
        400:
          description: Bad Request - Missing or invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        404:
          description: Not Found - Unsupported clause, attribute, or ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete a configuration value
      description: Deletes a value matching the specified clause, attribute, and ID.
      security:
        - bearerAuth: []
      parameters:
        - name: clause
          in: path
          required: true
          description: The clause in the configuration file (e.g., server).
          schema:
            type: string
        - name: attribute
          in: path
          required: true
          description: The attribute within the clause to delete.
          schema:
            type: string
        - name: value_id
          in: path
          required: true
          description: The ID of the value to delete.
          schema:
            type: string
      responses:
        200:
          description: Value successfully deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: object
                  status:
                    type: integer
                    example: 200
        404:
          description: Not Found - Unsupported clause, attribute, or ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        reason:
          type: string
        status:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
